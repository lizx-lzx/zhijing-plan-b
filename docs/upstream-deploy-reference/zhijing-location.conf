location = /zhijing { return 301 /zhijing/; }

location ^~ /zhijing/api/ {
    proxy_pass http://127.0.0.1:4330;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 256k;
    proxy_read_timeout 360s;
    proxy_buffering off;
}

location ^~ /zhijing/_next/ {
    alias /home/ubuntu/apps/zhijing/current/dist/client/zhijing/_next/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}

location = /zhijing/demo/web-animation-sample.vtt {
    alias /home/ubuntu/apps/zhijing/current/public/demo/web-animation-sample.vtt;
    default_type text/vtt;
    access_log off;
    expires 1d;
}

location ^~ /zhijing/demo/ {
    alias /home/ubuntu/apps/zhijing/current/public/demo/;
    access_log off;
    expires 1d;
}

location ^~ /zhijing/ {
    proxy_pass http://127.0.0.1:4329;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
