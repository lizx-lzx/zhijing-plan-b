# This snippet is independent of /zhijing/ (Plan A).
location = /zhijing-b { return 301 /zhijing-b/; }

location ^~ /zhijing-b/api/ {
    proxy_pass http://127.0.0.1:4360;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 256k;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

location ^~ /zhijing-b/_next/ {
    alias /home/ubuntu/apps/zhijing-plan-b/current/dist/client/zhijing-b/_next/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}

location ^~ /zhijing-b/demo/ {
    alias /home/ubuntu/apps/zhijing-plan-b/current/public/demo/;
    index index.html;
    autoindex off;
    access_log off;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    include /etc/nginx/mime.types;
    types { text/vtt vtt; }
}

location ^~ /zhijing-b/ {
    proxy_pass http://127.0.0.1:4359;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
